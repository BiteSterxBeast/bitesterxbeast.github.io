<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>bitesterxbeast.github.io</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<meta http-equiv="refresh" content="0; url=channeldeck/home/">
<link rel="canonical" href="https://bitesterxbeast.github.io/channeldeck/home/">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  :root{
    --bg:#0B0D10;
    --text:#E8EAED;
    --muted:#8A93A1;
    --teal:#34D6C4;
    --line:#262B33;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%;
    background:
      radial-gradient(ellipse at 20% -10%, #1a1d24 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
  }
  .wrap{ padding:20px; }
  .live-dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--teal);
    display:inline-block;
    margin-bottom:18px;
    box-shadow:0 0 0 0 rgba(52,214,196,0.6);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(52,214,196,0.55);}
    70%{box-shadow:0 0 0 9px rgba(52,214,196,0);}
    100%{box-shadow:0 0 0 0 rgba(52,214,196,0);}
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:20px; font-weight:600; margin:0 0 8px; letter-spacing:0.02em;
  }
  p{ color:var(--muted); font-size:13px; margin:0 0 20px; }
  a.btn{
    display:inline-block;
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600;
    border-radius:7px; border:1px solid var(--teal);
    background:var(--teal); color:#04211D;
    padding:10px 18px; text-decoration:none;
    transition:background .15s;
  }
  a.btn:hover{ background:#4be2d1; }
</style>
</head>
<body>
  <div class="wrap">
    <span class="live-dot"></span>
    <h1>Redirecting to Channel Deck…</h1>
    <p>If you're not redirected automatically, click below.</p>
    <a class="btn" href="channeldeck/home/">Open Channel Deck</a>
  </div>
  <script>window.location.replace('channeldeck/home/');</script>
</body>
</html>
